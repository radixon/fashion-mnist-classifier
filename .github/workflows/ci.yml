name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on:  ubuntu-latest
  
    strategy:
    matrix:
      python-verison: [3.8, 3.9]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{matrix.python-verison}}
      uses: actions/setup-python@v3
      with:
        python-verison: ${{matrix.python-version}}
      
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip 
        key:  ${{runner.os}}-pip-${{hashFiles('**/requirements.txt')}}
        restore-keys: |
          ${{runner.os}}-pip-
    
    - name: Install dependenceis
      run:  |
        python -m pip install --upgrade pip
        pip install -r requirements.txt 
        pip install -e .

    - name: Run unit tests
      run:  |
        pytest tests/ -v --tb=short
      
    - name: Lint code with flake8
      run:  |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. GitHub editor is 127 chars wide
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 wide

    - name: Check code formatting with black (optional)
      run:  |
        pip install black
        black --check ---diff src/
      continue-on-error:  true
  
  docs:
    runs-on:  ubuntu latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"
      
      - name: Install dependencies
        run:  |
          pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocstrings[python]
      
      - name: Deploy docs
        run:  mkdocs gh-deploy --force