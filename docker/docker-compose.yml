# docker/docker-compose.yml
version: '3.8'

services:
  fashion-mnist-trainer:
    build:
      context:  ..
      dockerfile: docker/Dockerfile
    container_name: fashion-mnist-trainer
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../logs:/app/logs
    command:  python scripts/train.py
    environment:
      - PYTHONPATH=/APP
  
  fashion-mnist-evaluator:
    build:
      context:  ..
      dockerfile: docker/Dockerfile
    container_name: fashion-mnist-evaluator
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../logs:/app/logs
    command:  python  scripts/evaluate.py
    environment:
      - PYTHONPATH=/app
    depends_on:
      - fashion-mnist-trainer

  streamlit-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fashion-mnist-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ../models:/app/models:ro
      - ../configs:/app/configs:ro
      - ../results:/app/results:ro
    environment:
      - PYTHONPATH=/app
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  
  flask-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fashion-mnist-flask-api
    ports:
      - "5000:5000"
    volumes:
      - ../models:/app/models:ro
      - ../configs:/app/configs:ro
      - ../results:/app/results:ro
    environment:
      - PYTHONPATH=/app
      - FLASK_APP=app/flask_app.py
      - FLASK_ENV=production
    command: ["python", "app/flask_app.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: fashion-mnist-network